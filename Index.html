<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLAT·DEX - Nơi các siêu nhân để ra</title>
    <!-- Font hiện đại, cảm giác công nghệ -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 30%, #0b1a2e, #03070f);
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 48px;
            padding: 50px 40px 45px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.05) inset;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Logo & Slogan */
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(3.2rem, 12vw, 5.6rem);
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .logo span {
            color: #f5c518;
            text-shadow: 0 0 40px rgba(245, 197, 24, 0.5);
        }

        .logo .dot {
            color: #f5c518;
            margin: 0 2px;
        }

        .slogan {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: clamp(1rem, 3vw, 1.5rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            background: linear-gradient(90deg, #f5c518, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            border-bottom: 1px dashed rgba(255, 215, 0, 0.2);
            padding-bottom: 18px;
        }

        /* Nút tải chính */
        .download-btn-wrapper {
            margin: 28px 0 40px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: linear-gradient(145deg, #f5c518, #e6a800);
            color: #0b1a2e;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            padding: 18px 44px;
            border: none;
            border-radius: 60px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px -5px rgba(245, 197, 24, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.1) inset;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #ffe066, #f5c518);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 40px -5px rgba(245, 197, 24, 0.7);
        }

        .download-btn:hover::before {
            opacity: 1;
        }

        .download-btn span,
        .download-btn svg {
            position: relative;
            z-index: 2;
        }

        .download-btn svg {
            width: 26px;
            height: 26px;
            fill: #0b1a2e;
            transition: transform 0.2s ease;
        }

        .download-btn:hover svg {
            transform: translateY(2px);
        }

        /* Khung mô tả & lưu ý */
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 10px;
            text-align: left;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 24px;
            padding: 22px 28px;
            backdrop-filter: blur(4px);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .info-card:hover {
            border-color: rgba(245, 197, 24, 0.4);
            box-shadow: 0 8px 25px -10px rgba(245, 197, 24, 0.15);
        }

        .info-card .label {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f5c518;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card .label .badge {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f5c518;
            box-shadow: 0 0 12px #f5c518;
        }

        .info-card .content {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            line-height: 1.7;
            font-weight: 400;
        }

        .info-card .content .placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.5px;
            border-left: 3px solid rgba(255, 215, 0, 0.2);
            padding-left: 16px;
            display: block;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .container {
                padding: 30px 20px 30px;
                border-radius: 32px;
            }
            .download-btn {
                width: 100%;
                padding: 16px 20px;
                font-size: 1rem;
            }
            .info-card {
                padding: 18px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- LOGO + SLOGAN (như ảnh) -->
        <div class="logo">
            PLAT<span class="dot">·</span>DEX
        </div>
        <div class="slogan">
            NƠI CÁC SIÊU NHÂN ĐỂ RA
        </div>

        <!-- NÚT TẢI MOBILECONFIG -->
        <div class="download-btn-wrapper">
            <a href="platdexx.mobileconfig" class="download-btn" download>
                <!-- Icon tải SVG đơn giản -->
                <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                <span>Tải cấu hình MobileConfig</span>
            </a>
        </div>

        <!-- PHẦN MÔ TẢ VÀ LƯU Ý (có khung) -->
        <div class="info-grid">

            <!-- Khung Mô tả -->
            <div class="info-card">
                <div class="label">
                    <span class="badge"></span> Mô tả
                </div>
                <div class="content">
                    <span class="placeholder">
                        〢 Nội dung mô tả tạm thời để ... <br />
                        〢 Chi tiết về cấu hình, chức năng, hoặc hướng dẫn cài đặt.
                    </span>
                </div>
            </div>

            <!-- Khung Lưu ý -->
            <div class="info-card">
                <div class="label">
                    <span class="badge"></span> Lưu ý
                </div>
                <div class="content">
                    <span class="placeholder">
                        〢 Nội dung lưu ý tạm thời để ... <br />
                        〢 Các cảnh báo quan trọng, điều kiện áp dụng hoặc yêu cầu hệ thống.
                    </span>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
